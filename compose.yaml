name: ai-jobs-market

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:?Identifiant MongoDB manquant}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Mot de passe MongoDB manquant}"
      MONGO_APP_USERNAME: "${MONGO_APP_USERNAME:?Compte application manquant}"
      MONGO_APP_PASSWORD: "${MONGO_APP_PASSWORD:?Mot de passe application manquant}"
      MONGO_IMPORT_USERNAME: "${MONGO_IMPORT_USERNAME:?Compte import manquant}"
      MONGO_IMPORT_PASSWORD: "${MONGO_IMPORT_PASSWORD:?Mot de passe import manquant}"

    volumes:
      - mongo_data:/data/db
      - ./database/scripts_initialisation:/docker-entrypoint-initdb.d:ro

    networks:
      - ai_jobs_network

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "if (db.adminCommand({ ping: 1 }).ok !== 1) quit(1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  import-data:
    build:
      context: .
      dockerfile: database/Dockerfile.import

    profiles:
      - tools

    restart: "no"

    environment:
      MONGO_HOST: mongodb
      MONGO_DATABASE: ai_jobs
      MONGO_USERNAME: "${MONGO_IMPORT_USERNAME:?Compte import manquant}"
      MONGO_PASSWORD: "${MONGO_IMPORT_PASSWORD:?Mot de passe import manquant}"

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - ai_jobs_network

  app:
    build:
      context: .
      dockerfile: app/Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      MONGO_HOST: mongodb
      MONGO_DATABASE: ai_jobs
      MONGO_USERNAME: "${MONGO_APP_USERNAME:?Compte application manquant}"
      MONGO_PASSWORD: "${MONGO_APP_PASSWORD:?Mot de passe application manquant}"

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - ai_jobs_network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo_data:

networks:
  ai_jobs_network:
    driver: bridge